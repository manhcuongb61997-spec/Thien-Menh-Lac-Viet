<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132b31"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lạc Việt"><title>Thiên Mệnh Lạc Việt — Bản chơi thử iOS</title><style>
:root{color-scheme:dark;--bg:#10252c;--panel:#1b3438;--gold:#e7c583;--cream:#f5e9ce;--muted:#b4c6c3;--line:#7e795a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#34585a 0,transparent 60%),linear-gradient(165deg,#12272c,#09181f);color:var(--cream);font-family:ui-serif,Georgia,'Times New Roman',serif;min-height:100dvh}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 18px,#cfb675 19px 20px)}.app{max-width:660px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 17px calc(env(safe-area-inset-bottom) + 32px)}.brand{text-align:center;padding:12px 0 17px}.seal{margin:auto;width:68px;height:68px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:35px;box-shadow:0 0 0 5px #c6a85b22,0 0 0 9px #c6a85b12}.eyebrow{font:12px system-ui;letter-spacing:3px;color:var(--gold);margin:15px 0 4px}.brand h1{font-size:clamp(25px,7vw,39px);margin:0;color:#f1d494;letter-spacing:1px;text-shadow:0 2px 15px #050b0b}.brand p{font-size:13px;color:var(--muted);margin:9px 0 0}.card{background:linear-gradient(145deg,#244347e8,#142a30f2);border:1px solid #b6a06a7a;border-radius:17px;padding:19px;margin:14px 0;box-shadow:0 8px 24px #0004}.card h2{font-size:23px;color:var(--gold);text-align:center;margin:2px 0 14px}.card p{line-height:1.65;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{border:1px solid #bca7764d;background:#0b20258a;border-radius:10px;padding:10px}.stat span{display:block;color:var(--muted);font:12px system-ui;margin-bottom:5px}.stat strong{font:600 16px system-ui;color:#fff2d4}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.actions button{min-height:51px;border-radius:11px;border:1px solid #d2b77d;background:linear-gradient(#765b33,#47371f);color:#fff1d4;font:600 15px system-ui;padding:10px 8px;touch-action:manipulation}.actions button:active{transform:scale(.98)}.actions button.secondary{background:#17343a;border-color:#73948b}.actions button.wide{grid-column:1/-1}.actions button:disabled{opacity:.45}.log{font:13px/1.6 system-ui;color:#c4d3cc}.log div{padding:7px 0;border-bottom:1px solid #ffffff12}.footer{text-align:center;font:11px/1.5 system-ui;color:#9fb2ad;padding:15px}.bar{height:8px;background:#091b20;border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8fbb9a,#d8cf8b);border-radius:8px}.hero-art{height:130px;border-radius:12px;margin:14px 0;background:radial-gradient(ellipse at 55% 100%,#e0c88766 0 7%,transparent 8%),linear-gradient(150deg,transparent 55%,#203e3c 55% 62%,transparent 63%),linear-gradient(28deg,transparent 50%,#385d56 51% 62%,transparent 63%),linear-gradient(#4b6d6b,#162e35);display:flex;align-items:flex-start;justify-content:center;padding-top:17px;color:#e8d7a4;font-size:13px;letter-spacing:3px}.toast{background:#d4b57a;color:#1c2927;padding:11px;border-radius:9px;font:600 13px system-ui;margin-top:12px}button:focus-visible{outline:3px solid white;outline-offset:2px}@media(min-width:560px){.actions{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(prefers-reduced-motion:no-preference){.card{animation:fade .2s ease-out}@keyframes fade{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style></head><body><main class="app"><header class="brand"><div class="seal" aria-hidden="true">◈</div><div class="eyebrow">HUYỀN THOẠI NON SÔNG</div><h1>THIÊN MỆNH LẠC VIỆT</h1><p>Trống đồng vọng núi · Mây phủ non sông · Một kiếp tìm đạo</p></header><section id="view" aria-live="polite"></section><section class="card"><h2>Nhật ký hành trình</h2><div id="log" class="log"></div></section><footer class="footer">Bản chơi thử iPhone/iPad v0.1 · Lưu tiến trình trên thiết bị · Không cần mạng sau khi tải trang</footer></main><script>
'use strict';
const KEY='tmlv_ios_web_v01',REALMS=['Phàm Nhân','Dẫn Khí','Khai Mạch','Tụ Linh','Kết Đan','Ngự Thần','Chân Nhân'];
const SURNAMES=['Lạc','Hùng','Trưng','Đinh','Phạm','Ngô','Mai','Vũ'],GIVEN=['Minh Sơn','Thanh Vân','An Nhiên','Hải Đăng','Bạch Liên','Trường Phong','Ngọc Hà','Thiên Lam'],GIFTS=['Huyết mạch Rồng Tiên','Mắt nhìn linh mạch','Tâm như nước lặng','Khí cốt trống đồng','Duyên với sơn linh'];
const EVENTS=[{title:'Tiếng trống dưới lòng núi',body:'Giữa rừng sương, một nhịp trống cổ vọng lên. Dấu chân dẫn vào hang đá.',a:'Theo dấu chân',b:'Ngồi tĩnh tâm',gold:18,qi:22,hurt:8},{title:'Dòng suối của Mẫu',body:'Bên suối, một bà lão mời bạn chén nước lá. Hương thơm dịu mát lan khắp sườn đồi.',a:'Nhận chén nước',b:'Biếu bà ít lương thực',gold:12,qi:16,hurt:0},{title:'Bóng chim Lạc',body:'Một chim Lạc bị thương đậu trên cành đa. Dưới gốc cây là chiếc vòng đồng lạ.',a:'Chữa lành chim',b:'Nhặt chiếc vòng',gold:26,qi:14,hurt:5},{title:'Người giữ bến sông',body:'Người lái đò kể chuyện linh vật canh giữ khúc sông mùa lũ.',a:'Hỏi về linh vật',b:'Giúp chèo đò',gold:20,qi:18,hurt:4},{title:'Đêm hội trống đồng',body:'Lửa hội bập bùng. Các bô lão mời bạn chọn giữa múa kiếm và nghe chuyện cổ.',a:'Thử tài múa kiếm',b:'Nghe chuyện cổ',gold:15,qi:20,hurt:3}];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rand(0,a.length-1)], esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let hero=null,log=[],event=null,enemy=null,page='home',toast='';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.hero&&typeof d.hero.name==='string'){hero=d.hero;log=Array.isArray(d.log)?d.log.slice(0,7):[];return true}}catch(e){}return false}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,hero,log}))}catch(e){toast='Không lưu được: hãy mở trong Safari và cho phép lưu dữ liệu.'}}
function record(s){log.unshift(s);log=log.slice(0,7)}
function need(){return 45+hero.realm*40}
function tick(){hero.age++;if(hero.age>=hero.maxAge)record('Tuổi thọ đã tận. Một kiếp người khép lại.')}
function dead(){return hero.hp<=0||hero.age>=hero.maxAge}
function newHero(rebirths=0){hero={name:pick(SURNAMES)+' '+pick(GIVEN),gift:pick(GIFTS),realm:0,age:16,maxAge:65+Math.min(30,rebirths*3),hp:100,maxHp:100,qi:0,gold:35,power:10+Math.min(20,rebirths*2),defense:3,rebirths,victories:0,potions:2};log=[];record('Một mệnh số mới xuất hiện dưới bóng núi Tản.');save();page='character';render()}
function card(title,body){return `<div class="card"><h2>${esc(title)}</h2>${body}</div>`}
function btn(label,action,secondary=false,wide=false){return `<button type="button" data-action="${action}" class="${secondary?'secondary ':''}${wide?'wide':''}">${esc(label)}</button>`}
function actions(...items){return `<div class="actions">${items.join('')}</div>`}
function stat(label,value){return `<div class="stat"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`}
function status(){if(!hero)return '';return card('Mệnh số hiện tại',`<div class="stats">${stat('Đạo hữu',hero.name)}${stat('Cảnh giới',REALMS[hero.realm])}${stat('Tuổi thọ',hero.age+' / '+hero.maxAge)}${stat('Sinh lực',hero.hp+' / '+hero.maxHp)}${stat('Linh khí',hero.qi+' / '+need())}${stat('Tiền đồng',hero.gold)}</div><div class="bar"><i style="width:${Math.min(100,Math.max(0,hero.hp/hero.maxHp*100))}%"></i></div>`)}
function render(){const v=document.getElementById('view');let html='';if(page==='home'){html=card('Từ cõi người bước vào huyền thoại',`<div class="hero-art">SƠN HÀ · LINH KHÍ · TRUYỀN THỪA</div><p>Khởi đầu từ một phàm nhân. Tích tụ linh khí, vượt kiếp nạn, đối mặt yêu thú và viết nên vận mệnh của riêng mình.</p>`+actions(btn('Tạo nhân vật','new',false,true),...(hero?[btn('Tiếp tục hành trình','journey',true,true)]:[]),btn('Giới thiệu','about',true,true)))}
else if(page==='about'){html=card('Giới thiệu',`<p>Game độc lập lấy cảm hứng từ thần thoại Việt Nam. Bản chơi thử có tạo nhân vật, tu luyện, đột phá, thám hiểm, chiến đấu, luân hồi và lưu tiến trình.</p><p>Đây là bản chạy trên Safari iOS, chưa phải ứng dụng IPA cài qua App Store.</p>`+actions(btn('Trở về','home',true,true)))}
else if(page==='character'){html=status()+card('Thân thế người Lạc Việt',`<p><b>Thiên phú:</b> ${esc(hero.gift)}</p><div class="stats">${stat('Sức mạnh',hero.power)}${stat('Phòng ngự',hero.defense)}${stat('Linh dược',hero.potions)}${stat('Luân hồi',hero.rebirths)}${stat('Trận thắng',hero.victories)}${stat('Linh khí cần đột phá',need())}</div>`+actions(btn('Bước vào hành trình','journey',false,true),btn('Đổi vận mệnh','new',true,true)))}
else if(page==='journey'){if(dead()){page='end';return render()}html=status()+card('Non sông gọi bước','<p>Mỗi lần tu luyện, thám hiểm hoặc săn yêu thú, thời gian trôi thêm một năm. Hãy chọn con đường của mình.</p>'+actions(btn('Tu luyện','cultivate'),btn('Đột phá','breakthrough'),btn('Thám hiểm','explore'),btn('Săn yêu thú','hunt'),btn('Dùng linh dược','potion'),btn('Xem nhân vật','character',true),btn('Lưu hành trình','save',true),btn('Về trang đầu','home',true)))}
else if(page==='event'){html=status()+card(event.title,`<div class="hero-art">CƠ DUYÊN GIỮA NON SÔNG</div><p>${esc(event.body)}</p>`+actions(btn(event.a,'eventA'),btn(event.b,'eventB',true)))}
else if(page==='battle'){if(hero.hp<=0){page='end';return render()}html=status()+card('Giao tranh giữa núi rừng',`<p><b>${esc(enemy.name)}</b> · Sinh lực ${enemy.hp}/${enemy.maxHp}</p><div class="bar"><i style="width:${Math.max(0,enemy.hp/enemy.maxHp*100)}%"></i></div>`+actions(btn('Xuất chiêu','attack'),btn('Dùng linh dược','battlePotion'),btn('Rút lui','flee',true)))}
else if(page==='end'){html=card('Một kiếp khép lại',`<p><b>${esc(hero.name)}</b> đã trải qua ${hero.age} năm, đạt cảnh giới ${esc(REALMS[hero.realm])} và thắng ${hero.victories} trận.</p><p>Luân hồi giữ lại chút căn cốt và ký ức về đường tu luyện.</p>`+actions(btn('Luân hồi tái sinh','rebirth',false,true),btn('Về trang đầu','home',true,true)))}
v.innerHTML=html+(toast?`<div class="toast" role="status">${esc(toast)}</div>`:'');toast='';document.getElementById('log').innerHTML=log.length?log.map(s=>`<div>• ${esc(s)}</div>`).join(''):'<div>Chưa có hành trình nào được ghi lại.</div>'}
function enemyTurn(){const dmg=Math.max(1,enemy.power+rand(0,6)-hero.defense);hero.hp=Math.max(0,hero.hp-dmg);record(enemy.name+' phản công, gây '+dmg+' sát thương.')}
function potion(battle=false){if(hero.potions<=0){record('Không còn linh dược.');return}hero.potions--;hero.hp=Math.min(hero.maxHp,hero.hp+45);record('Dùng linh dược, hồi phục tối đa 45 sinh lực.');if(battle)enemyTurn()}
function act(a){if(a==='home'||a==='about'||a==='character'||a==='journey'){if(a==='character'&&!hero)return;page=a}
else if(a==='new'){if(hero&&!confirm('Tạo nhân vật mới sẽ ghi đè tiến trình hiện tại. Tiếp tục?'))return;newHero();return}
else if(a==='rebirth'){newHero(hero.rebirths+1);record('Luân hồi lần '+hero.rebirths+': căn cốt được tăng cường.');save();return render()}
else if(a==='cultivate'){const gain=rand(12,25)+hero.realm*3+hero.rebirths*2;hero.qi+=gain;tick();record('Tĩnh tọa bên suối, hấp thụ '+gain+' linh khí.');save()}
else if(a==='breakthrough'){if(hero.realm>=REALMS.length-1)record('Đã đạt cảnh giới cao nhất của bản chơi thử.');else if(hero.qi<need())record('Thiếu linh khí để đột phá: cần '+need()+'.');else{hero.qi-=need();hero.realm++;hero.maxHp+=28;hero.hp=hero.maxHp;hero.power+=7;hero.defense+=2;hero.maxAge+=18;record('Đột phá thành công! Bước vào cảnh giới '+REALMS[hero.realm]+'.')}save()}
else if(a==='explore'){tick();if(dead()){save();page='end'}else{event=pick(EVENTS);page='event'} }
else if(a==='eventA'||a==='eventB'){if(!event)return;if(a==='eventA'){hero.qi+=event.qi;hero.hp=Math.max(0,hero.hp-event.hurt);record('Cơ duyên: nhận '+event.qi+' linh khí, hao '+event.hurt+' sinh lực.')}else{hero.gold+=event.gold;record('Nhận '+event.gold+' đồng nhờ lựa chọn của mình.')}event=null;page='journey';save()}
else if(a==='hunt'){tick();if(dead()){page='end';save()}else{const name=pick(['Hổ tinh rừng già','Thuồng luồng sông sâu','Mộc linh cổ thụ','Bóng ma đèo vắng']);const hp=35+hero.realm*19;enemy={name,hp,maxHp:hp,power:7+hero.realm*4,reward:14+hero.realm*9};page='battle'}}
else if(a==='attack'){if(!enemy)return;const dmg=rand(7,13)+hero.power;enemy.hp=Math.max(0,enemy.hp-dmg);record('Bạn gây '+dmg+' sát thương lên '+enemy.name+'.');if(enemy.hp<=0){hero.gold+=enemy.reward;hero.qi+=15+hero.realm*5;hero.victories++;record('Chiến thắng! Nhận '+enemy.reward+' đồng và linh khí.');page='journey'}else enemyTurn();save()}
else if(a==='potion'){potion();save()}
else if(a==='battlePotion'){potion(true);save()}
else if(a==='flee'){record('Bạn rút khỏi cuộc giao tranh.');page='journey';save()}
else if(a==='save'){save();toast='Đã lưu hành trình trên thiết bị.'}
render()}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b)act(b.dataset.action)});load();render();
</script></body></html>
